# Prometheus for the fake-vLLM variant of the stack (Phase 6a): the platform
# plus the engines' own /metrics, as Phase 6b will scrape real vLLM servers.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: platform
    static_configs:
      - targets: ["platform:8080"]
  - job_name: vllm
    static_configs:
      - targets: ["fakevllm-1:8000", "fakevllm-2:8000", "fakevllm-3:8000"]
