# Grafana with the same provisioning and dashboard as the Docker stack.
# Local only: anonymous read-only access; admin/admin to edit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 5s
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: llm-platform
        folder: LLM Platform
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
data:
  llm-platform-overview.json: |
    {{- required "pass the dashboard: --set-file grafana.dashboard=deploy/observability/grafana/dashboards/llm-platform-overview.json" .Values.grafana.dashboard | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
      annotations:
        checksum/dashboard: {{ .Values.grafana.dashboard | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/llm-platform-overview.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
