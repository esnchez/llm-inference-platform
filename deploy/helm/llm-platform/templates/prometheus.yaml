{{- $ns := .Release.Namespace -}}
# Prometheus (decision 2): the platform's admin port and the engines found by
# the same DNS names the platform resolves. Ephemeral storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: platform
        static_configs:
          - targets: ["platform-admin.{{ $ns }}.svc.cluster.local:8081"]
      - job_name: vllm
        dns_sd_configs:
          - type: A
            port: 8000
            refresh_interval: 10s
            names:
              {{- if .Values.fakevllm.enabled }}
              - fakevllm.{{ $ns }}.svc.cluster.local
              {{- end }}
              {{- if .Values.vllmCpu.enabled }}
              - vllm-cpu.{{ $ns }}.svc.cluster.local
              {{- end }}
  alerts.yml: |
    {{- required "pass the alerts: --set-file prometheus.alerts=deploy/observability/prometheus/alerts.yml" .Values.prometheus.alerts | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus}
      annotations:
        checksum/config: {{ printf "%s%s" .Values.prometheus.alerts .Values.fakevllm.enabled | sha256sum }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
