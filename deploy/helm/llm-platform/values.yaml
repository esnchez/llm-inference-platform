# Values for the local deployment (Phase 7). Install with `task k8s:up`,
# which also passes the dashboard and the alerts with --set-file (the same
# files as the Docker stack, no copies):
#   --set-file grafana.dashboard=deploy/observability/grafana/dashboards/llm-platform-overview.json
#   --set-file prometheus.alerts=deploy/observability/prometheus/alerts.yml

# Images built locally and loaded with `minikube image load` (no registry).
imagePullPolicy: IfNotPresent

platform:
  image: llm-platform:dev
  # Single replica with Recreate (decision 7, FI-2): never two ledgers at once.
  # Extra flags for cmd/platform (e.g. the CPU profile when vllmCpu is on).
  extraArgs: []
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 256Mi}

fakevllm:
  enabled: true
  image: llm-fakevllm:dev
  # Initial replicas; KEDA owns the count when autoscaling is enabled.
  replicas: 1
  # Budget per fake = numGpuBlocks × 16 tokens (16384).
  args: ["-model", "sim-llama-3-8b", "-num-gpu-blocks", "1024", "-max-model-len", "8192",
         "-ttft", "60ms", "-itl", "20ms", "-loading-for", "5s", "-shutdown-grace", "50s"]
  # Must exceed -shutdown-grace: streams in flight finish before the kill.
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 128Mi}

# KEDA ScaledObject on the fakevllm Deployment (decision 5). Requires KEDA in
# the cluster (task k8s:up installs it).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  # Target demand per replica, in tokens: 70% of one fake's budget (16384).
  targetTokens: 11468
  pollingInterval: 10
  cooldownPeriod: 60
  # HPA scale-down stabilization (Kubernetes default: 300 s). Shorter for
  # the demo; production would keep minutes to avoid flapping.
  scaleDownStabilizationSeconds: 30

# vLLM on CPU (Phase 6b-CPU): off by default (1.8 GB image, ~6 GB of memory, ~6 min warm-up).
# Not autoscaled. With it on, add the CPU profile to platform.extraArgs:
#   ["-ttft-timeout","30s","-ttft-timeout-per-token","25ms","-stall-timeout","30s"]
vllmCpu:
  enabled: false
  image: vllm/vllm-openai-cpu:v0.34.0-x86_64
  model: Qwen/Qwen2.5-0.5B-Instruct
  maxModelLen: 4096
  kvCacheBytes: "1073741824"
  cacheSize: 5Gi
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {memory: 6Gi}

prometheus:
  image: prom/prometheus:v3.5.0
  # Contents of deploy/observability/prometheus/alerts.yml (--set-file).
  alerts: ""

grafana:
  image: grafana/grafana:12.1.0
  # Contents of the dashboard JSON (--set-file).
  dashboard: ""
