# Task runner: https://taskfile.dev  (`task --list` shows every task)
version: "3"

vars:
  # Go module root: all source code lives here.
  PLATFORM_DIR: platform
  # Oldest Go version supported (go.mod). The race tests run against it.
  GO_IMAGE: golang:1.23
  # How many times the race tests repeat, to shake out flaky interleavings.
  RACE_COUNT: 5
  COVER_FILE: coverage.out
  # Local observability stack (Phase 5).
  STACK_FILE: deploy/observability/docker-compose.yml
  STACK_FAKE_VLLM: deploy/observability/docker-compose.fake-vllm.yml
  STACK_VLLM_CPU: deploy/observability/docker-compose.vllm-cpu.yml
  # Real vLLM on CPU (Phase 6b-CPU): pinned image and model.
  VLLM_CPU_IMAGE: vllm/vllm-openai-cpu:v0.34.0-x86_64
  VLLM_CPU_MODEL: Qwen/Qwen2.5-0.5B-Instruct
  # Local Kubernetes (Phase 7): a dedicated minikube profile, so no other
  # cluster on the machine is touched. Every command names its context.
  K8S_PROFILE: llm-platform
  K8S_NS: llm
  KEDA_VERSION: 2.21.1
  CHART_DIR: deploy/helm/llm-platform

tasks:
  default:
    desc: Run the full local test suite (same as `task check`)
    cmds:
      - task: check

  # ---- run / build ----

  run:
    desc: "Run the control plane with simulated workers (extra flags: task run -- -workers 5)"
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - go run ./cmd/platform {{.CLI_ARGS}}

  loadgen:
    desc: "Send realistic load to a running platform (extra flags: task loadgen -- -rate 50 -duration 30s)"
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - go run ./cmd/loadgen {{.CLI_ARGS}}

  build:
    desc: Build the platform and loadgen binaries into platform/bin/
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - go build -o bin/platform{{exeExt}} ./cmd/platform
      - go build -o bin/loadgen{{exeExt}} ./cmd/loadgen
      - go build -o bin/fakevllm{{exeExt}} ./cmd/fakevllm

  # ---- observability stack (Phase 5, docs/servicio/12-observabilidad.md) ----

  stack:up:
    desc: "Start platform + Prometheus + Grafana in Docker (http://localhost:3000, :9090, :8080)"
    cmds:
      - docker compose -f {{.STACK_FILE}} up -d --build
      - cmd: 'echo "Grafana: http://localhost:3000  Prometheus: http://localhost:9090  API: http://localhost:8080"'
        silent: true

  stack:up:fake-vllm:
    desc: "Like stack:up, but the platform talks over HTTP to 3 fake vLLM servers (Phase 6a; break them on :8001-8003/fake/faults)"
    cmds:
      - docker compose -f {{.STACK_FILE}} -f {{.STACK_FAKE_VLLM}} up -d --build
      - cmd: 'echo "Grafana: http://localhost:3000  Prometheus: http://localhost:9090  API: http://localhost:8080  fake vLLM: :8001-8003"'
        silent: true

  stack:up:vllm-cpu:
    desc: "Like stack:up, but with real vLLM on CPU (Phase 6b-CPU): one instance, ~6 min of warm-up"
    cmds:
      - docker compose -f {{.STACK_FILE}} -f {{.STACK_VLLM_CPU}} up -d --build
      - cmd: 'echo "vLLM is warming up (~6 min); the platform registers it when ready (task stack:logs)"'
        silent: true

  stack:up:vllm-cpu:2:
    desc: "Like stack:up:vllm-cpu, with two vLLM instances on separate cores (the benchmark)"
    env:
      VLLM_URLS: http://vllm-1:8000,http://vllm-2:8000
    cmds:
      - docker compose --profile two -f {{.STACK_FILE}} -f {{.STACK_VLLM_CPU}} up -d --build
      - cmd: 'echo "Two vLLM instances warming up (~6-10 min); task stack:logs to follow"'
        silent: true

  stack:down:
    desc: Stop and remove the observability stack, either variant (its data is not kept)
    cmds:
      - docker compose --profile two -f {{.STACK_FILE}} -f {{.STACK_VLLM_CPU}} down --remove-orphans

  # ---- local Kubernetes (Phase 7, docs/servicio/16) ----

  k8s:up:
    desc: "Start minikube (profile llm-platform), load the images, install KEDA and the chart (extra helm flags: task k8s:up -- --set vllmCpu.enabled=true)"
    cmds:
      - minikube status -p {{.K8S_PROFILE}} >/dev/null 2>&1 || minikube start -p {{.K8S_PROFILE}} --driver=docker --cpus=6 --memory=10240
      - docker build -t llm-platform:dev {{.PLATFORM_DIR}}
      - docker build -t llm-fakevllm:dev --build-arg CMD=fakevllm {{.PLATFORM_DIR}}
      - minikube -p {{.K8S_PROFILE}} image load --overwrite llm-platform:dev
      - minikube -p {{.K8S_PROFILE}} image load --overwrite llm-fakevllm:dev
      - helm repo add kedacore https://kedacore.github.io/charts --force-update
      - helm --kube-context {{.K8S_PROFILE}} upgrade --install keda kedacore/keda --version {{.KEDA_VERSION}} -n keda --create-namespace --wait
      - >-
        helm --kube-context {{.K8S_PROFILE}} upgrade --install llm-platform {{.CHART_DIR}} -n {{.K8S_NS}} --create-namespace --wait
        --set-file grafana.dashboard=deploy/observability/grafana/dashboards/llm-platform-overview.json
        --set-file prometheus.alerts=deploy/observability/prometheus/alerts.yml {{.CLI_ARGS}}
      # Same tag, new image: restart so the pods pick it up.
      - kubectl --context {{.K8S_PROFILE}} -n {{.K8S_NS}} rollout restart deployment/platform deployment/fakevllm
      - kubectl --context {{.K8S_PROFILE}} -n {{.K8S_NS}} get pods

  k8s:port-forward:
    desc: "Expose the API (8080), the admin port (localhost:18081; 8081 is often reserved on Windows) and Grafana (3000) on localhost; Ctrl+C stops"
    cmds:
      - >-
        kubectl --context {{.K8S_PROFILE}} -n {{.K8S_NS}} port-forward svc/grafana 3000:3000 &
        kubectl --context {{.K8S_PROFILE}} -n {{.K8S_NS}} port-forward svc/platform-admin 18081:8081 &
        kubectl --context {{.K8S_PROFILE}} -n {{.K8S_NS}} port-forward svc/platform 8080:8080

  k8s:status:
    desc: Pods, the KEDA ScaledObject and its HPA, and the workers the platform registered
    cmds:
      - kubectl --context {{.K8S_PROFILE}} -n {{.K8S_NS}} get pods,scaledobject,hpa

  k8s:down:
    desc: Delete the minikube profile llm-platform (cluster and data)
    cmds:
      - minikube delete -p {{.K8S_PROFILE}}

  stack:logs:
    desc: Follow the platform's JSON logs in the stack
    cmds:
      - docker compose -f {{.STACK_FILE}} logs -f platform

  # ---- real vLLM on CPU, standalone (Phase 6b-CPU) ----

  vllm-cpu:up:
    desc: "Start real vLLM on CPU on :8100 (pinned version; ~6 min warm-up, longer the first time)"
    cmds:
      - cmd: docker rm -f vllm-cpu
        ignore_error: true
      - docker run -d --name vllm-cpu -p 8100:8000 --shm-size 2g -v vllm-hf-cache:/root/.cache/huggingface -e VLLM_CPU_KVCACHE_SPACE=2 {{.VLLM_CPU_IMAGE}} {{.VLLM_CPU_MODEL}} --dtype float32 --max-model-len 4096
      - cmd: 'echo "Warming up; ready when curl localhost:8100/health answers 200"'
        silent: true

  vllm-cpu:down:
    desc: Stop and remove the standalone vLLM (the model cache volume is kept)
    cmds:
      - cmd: docker rm -f vllm-cpu
        ignore_error: true

  vllm-cpu:smoke:
    desc: Smoke test of the adapter against the vLLM of vllm-cpu:up (TestRealVLLM)
    dir: "{{.PLATFORM_DIR}}"
    env:
      VLLM_URL: http://localhost:8100
    cmds:
      - go test -count=1 -run TestRealVLLM -v ./internal/vllm

  # ---- testing suite ----

  fmt:
    desc: Format the code with gofmt
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any file is not gofmt-formatted
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - cmd: test -z "$(gofmt -l .)" || (echo "Files not formatted:" && gofmt -l . && exit 1)
        silent: true

  vet:
    desc: Static analysis with go vet
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - go vet ./...

  test:
    desc: Unit and HTTP tests (worker leases, pool routing, SSE API)
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Race-detector tests in a Linux container (needs Docker; no gcc required)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/{{.PLATFORM_DIR}}:/src" -w /src {{.GO_IMAGE}} go test -race -count={{.RACE_COUNT}} ./...

  test:race:local:
    desc: Race-detector tests on the host (needs cgo, i.e. gcc on Windows)
    dir: "{{.PLATFORM_DIR}}"
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -count={{.RACE_COUNT}} ./...

  test:cover:
    desc: Tests with a coverage report per function
    dir: "{{.PLATFORM_DIR}}"
    cmds:
      - go test -count=1 -coverprofile={{.COVER_FILE}} ./...
      - go tool cover -func={{.COVER_FILE}}

  check:
    desc: "Local suite: fmt:check, vet, test"
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  check:all:
    desc: "Full suite: check + race tests in Docker"
    cmds:
      - task: check
      - task: test:race
